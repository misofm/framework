[package]
name = "release_track_data"
edition = "2024"
license = "FSL-1.1-ALv2"
authors = ["Miso Labs, Inc. (contact@miso.fm)"]

# One value per track of a release. Construction reads `Release` to size/validate the
# array against the tracklist, so alignment is an invariant of the type rather
# than a rule each extension must remember — hence the dependency on miso_music.
[dependencies]
miso_music = { git = "https://github.com/misofm/music-protocol.git", rev = "430424a678f2387090850417eacbaa1bb46d1fb7" }
