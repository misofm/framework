# The genre vocabulary primitive: a canonical, name-derived set of `Genre` objects.
# Depends on nothing but the Sui framework by design, so any consumer — a
# release, a party, anything — can reference the shared vocabulary without
# pulling in a protocol. Genre *assignment* lives in the separate consumer
# packages (release_genre, party_genre, …).
